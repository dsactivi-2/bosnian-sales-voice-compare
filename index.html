<!DOCTYPE html>

<title>Voice Compare · Bosnisch Telefonsales</title>
<style>
:root{--bg:#0b0f14;--surface:#141a22;--s2:#1b2330;--fg:#eef2f7;--muted:#8b98ab;--border:#2a3545;--primary:#2f9bfd;--pfg:#041018;--accent:#3dd6c6;--star:#f5c542;--male:#7dd3fc;--female:#f0abfc;--danger:#f87171;--ok:#34d399}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(1000px 480px at 8% -8%,rgb(30 58 95/.45),transparent 55%),var(--bg);color:var(--fg);line-height:1.5}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px 80px}
header{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px}
h1{margin:0 0 6px;font-size:1.35rem}
.sub{color:var(--muted);font-size:.9rem;margin:0}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:end}
label.field{display:flex;flex-direction:column;gap:4px;font-size:.75rem;color:var(--muted);flex:1;min-width:140px}
select,textarea,input{background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font:inherit}
select{height:42px}
.tabs{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:12px;margin-top:14px;flex-wrap:wrap}
.tabs button{flex:1;min-width:90px;border:0;background:transparent;color:var(--muted);padding:10px;border-radius:10px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--primary);color:var(--pfg)}
.script{margin-top:12px;padding:10px 12px;background:#0a1018;border-left:3px solid var(--accent);border-radius:8px;font-size:.8rem;color:#c9d4e6;word-break:break-word}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin:12px 0}
.card h2{margin:0 0 4px;font-size:1.05rem}
.meta{color:var(--muted);font-size:.88rem}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tag{font-size:.72rem;padding:2px 8px;border-radius:999px;border:1px solid var(--border);background:var(--s2);color:var(--muted)}
.tag.m{color:var(--male);border-color:#1e4a66}
.tag.f{color:var(--female);border-color:#5b2d6b}
audio{width:100%;margin:8px 0 12px}
.cat{margin:8px 0}
.cat-label{font-size:.75rem;color:var(--muted);margin-bottom:2px}
.stars{display:flex;align-items:center;gap:2px}
.stars button{background:none;border:0;cursor:pointer;font-size:1.25rem;line-height:1;padding:2px 3px;color:var(--border)}
.stars button.on{color:var(--star)}
.stars .zero{font-size:.7rem;color:var(--muted);margin-right:4px}
.avg{font-weight:700;color:var(--star);font-size:1.1rem}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}
.btn-p{background:var(--primary);color:var(--pfg)}
.btn-g{background:var(--s2);color:var(--fg);border:1px solid var(--border)}
.btn-d{background:transparent;color:var(--danger);border:1px solid var(--border)}
.btn-ok{background:rgb(52 211 153/.15);color:var(--ok);border:1px solid rgb(52 211 153/.35)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.team-box{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.team-box h3{margin:0 0 8px;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.rating-row{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:10px;margin:6px 0;font-size:.88rem}
.rating-row.pending{border-style:dashed;color:var(--muted)}
.filters{display:grid;gap:10px;grid-template-columns:1fr 1fr 1fr}
@media(max-width:560px){.filters{grid-template-columns:1fr}}
.chip{border:1px solid var(--border);background:var(--s2);color:var(--muted);border-radius:999px;padding:5px 10px;font-size:.75rem;cursor:pointer}
.chip.on{border-color:var(--primary);background:rgb(47 155 253/.15);color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.rank-num{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;background:var(--s2)}
.rank-num.gold{background:rgb(245 197 66/.2);color:var(--star)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--s2);border:1px solid var(--border);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:50;display:none;max-width:90vw}
.note{font-size:.78rem;color:var(--muted);margin-top:10px;padding:8px 10px;background:var(--bg);border-radius:8px;border:1px solid var(--border)}
.grid2{display:grid;gap:8px;grid-template-columns:1fr 1fr}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.head-row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.badge{font-size:.7rem;padding:2px 8px;border-radius:999px;border:1px solid var(--border);color:var(--muted)}
.badge.live{border-color:rgb(52 211 153/.4);color:var(--ok)}
.badge.draft{border-color:rgb(245 197 66/.4);color:var(--star)}
.voice-admin{display:grid;gap:10px}
.voice-admin .va-card{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px}
.voice-admin .va-head{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.muted-code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.75rem;color:var(--muted);word-break:break-all}
.form-grid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media(max-width:560px){.form-grid{grid-template-columns:1fr}}
.form-grid .full{grid-column:1/-1}
.help{font-size:.78rem;color:var(--muted);margin:0 0 10px}
.loading{padding:40px;text-align:center;color:var(--muted)}
</style>
</head>

function blindEnabled(){
  try {
    const q = new URLSearchParams(location.search).get("blind");
    if (q === "0") return false;
    if (q === "1") return true;
    const s = localStorage.getItem(BLIND_KEY);
    if (s === "0") return false;
  } catch {}
  return true;
}
function hasMyRating(vid, rev){
  const r = state[vid + "|" + rev];
  if (!r) return false;
  return CATS().some(c => +(r[c.k]||0) > 0) || !!(r.comment||"").trim();
}
function teamBoxHtml(vid, rev, cloudOnlineFlag){
  const all = voiceRatings(vid);
  const mineDone = hasMyRating(vid, rev);
  const blind = blindEnabled() && !mineDone;
  if (blind) {
    const pending = REVIEWERS().filter(n => n !== rev).length;
    return `<h3>Team-Wertungen (Blind)</h3>
      <p class="meta" style="margin:0">Peer-Scores versteckt, bis <strong>du</strong> diese Stimme speicherst.</p>
      <div class="rating-row pending"><strong>${esc(rev)}</strong> — deine Bewertung ausstehend</div>
      <div class="rating-row pending">übrige ${pending} Reviewer — ausgeblendet</div>`;
  }
  return `<h3>Team-Wertungen (${all.length}/${REVIEWERS().length})${cloudOnlineFlag?"":" · ⚠ Cloud offline"}</h3>
    ${all.length?"":`<p class="meta" style="margin:0 0 8px">Noch niemand hat diese Stimme bewertet. Sterne = Auto-Save.</p>`}
    ${REVIEWERS().map(name=>{
      const r = all.find(x=>x.reviewer===name);

      const av = avg(r);
      return `<div class="rating-row"><div style="display:flex;justify-content:space-between"><strong>${esc(name)}</strong><span class="avg" style="font-size:.95rem">Ø ${av.toFixed(2)}</span></div>

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 2400);
}
function esc(s){return String(s??"").replace(/&/g,"&"+"amp;").replace(/</g,"&"+"lt;").replace(/>/g,"&"+"gt;").replace(/"/g,"&"+"quot;")}

function saveRatings(data){ saveRatingsLocal(data); }

async function fetchCloudRatings(){
  try {
    const res = await fetch(API_BASE + "/api/ratings?_=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const ratings = data.ratings || {};
    cloudOnline = true;
    cloudCount = data.count != null ? data.count : Object.keys(ratings).length;
    return ratings;
  } catch (e) {
    console.warn("Cloud ratings load failed", e);
    cloudOnline = false;
    return null;
  }
}

async function pushRating(voiceId, reviewer, payload){
  try {
    if (lockedReviewer && reviewer !== lockedReviewer) { toast("Name gesperrt (persönlicher Link)"); return false; }
    if (!REVIEWERS().includes(reviewer)) { toast("Unbekannter Reviewer"); return false; }
    const body = {
      voice_id: voiceId,
      reviewer,
      pron: +(payload.pron||0),
      prof: +(payload.prof||0),
      warm: +(payload.warm||0),
      clar: +(payload.clar||0),
      emo: +(payload.emo||0),
      comment: payload.comment || "",
      ts: payload.ts || Date.now(),
    };
    const res = await fetch(API_BASE + "/api/ratings", {
      method: "PUT",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    cloudOnline = true;
    return true;
  } catch (e) {
    console.warn("Cloud save failed", e);
    cloudOnline = false;
    return false;
  }
}

async function deleteCloudRating(voiceId, reviewer){
  try {
    const res = await fetch(API_BASE + "/api/ratings?voice_id=" + encodeURIComponent(voiceId) + "&reviewer=" + encodeURIComponent(reviewer), { method: "DELETE" });
    return res.ok;
  } catch { return false; }
}

async function bulkPushRatings(map){
  try {
    const res = await fetch(API_BASE + "/api/ratings/bulk", {
      method: "PUT",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ ratings: map }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    cloudOnline = true;
    return true;
  } catch {
    cloudOnline = false;
    return false;
  }
}

async function clearCloudRatings(){
  const key = prompt("Admin-Key zum Löschen ALLER Cloud-Bewertungen (leer = Abbruch):");
  if (!key) return false;
  try {
    const res = await fetch(API_BASE + "/api/ratings?all=1", { method: "DELETE", headers: { "x-admin-key": key } });
    return res.ok;
  } catch { return false; }
}

  const cloud = await fetchCloudRatings();
  if (!cloud) return false;
  state = cloud;

}

async function saveVoiceRating(vid, rev, payload, { silent=false, refreshTeam=true } = {}){
  const full = { ...payload, ts: Date.now() };
  state[vid + "|" + rev] = full;
  saveRatingsLocal(state);
  const ok = await pushRating(vid, rev, full);
  if (ok && refreshTeam) {
    // re-pull so team box always matches DB truth
    const cloud = await fetchCloudRatings();
    if (cloud) {
      state = { ...state, ...cloud };
      // cloud wins for same keys by ts
      for (const [k,v] of Object.entries(cloud)) {
        const loc = state[k];
        if (!loc || (v.ts||0) >= (loc.ts||0)) state[k] = v;
      }
      saveRatingsLocal(state);
      cloudCount = Object.keys(state).filter(k => state[k] && typeof state[k]==='object').length;
    }
  } else {
    cloudCount = Object.keys(state).length;
  }
  if (!silent) toast(ok ? ("✓ In Cloud · " + rev) : ("⚠ Nur lokal · " + rev + " (Cloud offline)"));
  return ok;
}

function startCloudPoll(){
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    if (document.hidden) return;
    const cloud = await fetchCloudRatings();
    if (!cloud) return;
    let changed = false;
    for (const [k,v] of Object.entries(cloud)) {
      const cur = state[k];
      if (!cur || (v.ts||0) > (cur.ts||0) || JSON.stringify(cur) !== JSON.stringify({...v})) {
        // shallow compare fields
        if (!cur || cur.pron!==v.pron || cur.prof!==v.prof || cur.warm!==v.warm || cur.clar!==v.clar || cur.emo!==v.emo || (cur.comment||"")!==(v.comment||"")) {
          state[k] = v;
          changed = true;
        }
      }
    }
    // also pick up new keys
    for (const k of Object.keys(cloud)) {
      if (!state[k]) { state[k]=cloud[k]; changed=true; }
    }
    if (changed) {
      saveRatingsLocal(state);
      cloudCount = Object.keys(cloud).length;
      if (currentTab === "rate") renderRate();
      else if (currentTab === "rank") renderRank();
      // update badge without full header rebuild
      const note = document.querySelector(".note");
      if (note) {
        // light touch: leave full re-render to tab switches
      }
    }
  }, 8000);
}

function saveOverride(cfg){ localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }
function clearOverride(){ localStorage.removeItem(CFG_KEY); }
function hasOverride(){ return !!localStorage.getItem(CFG_KEY); }

function validateConfig(cfg){
  const errs = [];
  if (!cfg || typeof cfg !== "object") return ["Config ist kein Objekt"];
  if (!cfg.project?.title) errs.push("project.title fehlt");
  if (!cfg.script) errs.push("script fehlt");
  if (!Array.isArray(cfg.reviewers) || !cfg.reviewers.length) errs.push("reviewers[] leer");
  if (!Array.isArray(cfg.categories) || !cfg.categories.length) errs.push("categories[] leer");
  if (!Array.isArray(cfg.voices) || !cfg.voices.length) errs.push("voices[] leer");
  const ids = new Set();
  (cfg.voices||[]).forEach((v,i)=>{
    if (!v.id) errs.push(`voices[${i}].id fehlt`);
    if (!v.title) errs.push(`voices[${i}].title fehlt`);
    if (!v.audio) errs.push(`voices[${i}].audio fehlt`);
    if (!["m","f","x"].includes(v.sex)) errs.push(`voices[${i}].sex muss m|f|x sein`);
    if (v.id && ids.has(v.id)) errs.push(`doppelte id: ${v.id}`);
    if (v.id) ids.add(v.id);
  });
  return errs;
}

function applyConfig(cfg, source){
  const errs = validateConfig(cfg);
  if (errs.length) throw new Error(errs.join("; "));
  CONFIG = cfg;
  if (!state || typeof state !== "object") state = loadRatings();
  document.title = `${cfg.project.title} · Voice Compare`;
  renderApp(source);
}

async function boot(){
  let fileCfg = null;
  try {
    const r = await fetch("config.json", { cache: "no-store" });
    if (r.ok) fileCfg = await r.json();
  } catch {}
  if (!fileCfg && EMBEDDED_CONFIG) fileCfg = EMBEDDED_CONFIG;
  if (!fileCfg) {
    document.getElementById("boot").textContent = "config.json fehlt und kein Embed vorhanden.";
    return;
  }
  FILE_CONFIG = fileCfg;

  const local = loadRatings();
  const cloud = await fetchCloudRatings();
  if (cloud) {
    const merged = { ...local };
    for (const [k, v] of Object.entries(cloud)) {
      const loc = merged[k];
      if (!loc || (v.ts || 0) >= (loc.ts || 0)) merged[k] = v;
    }
    const localOnly = {};
    for (const [k, v] of Object.entries(local)) {
      if (!cloud[k]) localOnly[k] = v;
    }
    if (Object.keys(localOnly).length) {
      await bulkPushRatings(localOnly);
      const again = await fetchCloudRatings();
      if (again) for (const [k, v] of Object.entries(again)) merged[k] = v;
    }
    state = merged;
    saveRatingsLocal(state);
    cloudCount = Object.keys(state).length;
  } else {
    state = local;
  }

  const override = loadOverride();
  try {
    applyConfig(override || fileCfg, override ? "browser-override" : "file");
  } catch (e) {
    if (override) {
      clearOverride();
      toast("Ungültige Browser-Config verworfen");
      applyConfig(fileCfg, "file");
    } else {
      document.getElementById("boot").textContent = "Config ungültig: " + e.message;
    }
  }
  startCloudPoll();
  if (cloudOnline) {
    const n = Object.keys(state).length;
    setTimeout(() => toast(n ? (`Cloud: ${n} Team-Bewertungen geladen`) : "Cloud verbunden · noch keine Bewertungen"), 400);
  } else {
    setTimeout(() => toast("⚠ Cloud offline — Bewertungen nur lokal"), 400);
  }
}

function CATS(){ return CONFIG.categories; }
function REVIEWERS(){ return CONFIG.reviewers; }
function VOICES(){ return CONFIG.voices; }
function avg(r){
  if (!r) return null;
  const v = CATS().map(c => +r[c.k] || 0);
  return v.reduce((a,b)=>a+b,0) / v.length;
}
function starsHtml(value, name, editable){
  let h = `<div class="stars" data-name="${esc(name)}">`;
  if (editable) h += `<button type="button" class="zero" data-n="0" title="0 Sterne">0</button>`;
  for (let n=1;n<=5;n++) {
    h += `<button type="button" class="${n<=value?"on":""}" data-n="${n}" ${editable?"":"disabled"} aria-label="${n} Sterne">${n<=value?"★":"☆"}</button>`;
  }
  h += `<span style="margin-left:6px;font-size:.75rem;color:var(--muted)">${value}/5</span></div>`;
  return h;
}
function voiceRatings(vid){
  const out = [];
  for (const rev of REVIEWERS()) {
    const key = vid + "|" + rev;
    if (state[key]) out.push({ reviewer: rev, ...state[key] });
  }
  return out;
}
function teamAvg(vid){
  const rs = voiceRatings(vid);
  if (!rs.length) return null;
  return rs.map(avg).reduce((a,b)=>a+b,0)/rs.length;
}
function catAvg(vid,k){
  const rs = voiceRatings(vid);
  if (!rs.length) return null;
  return rs.reduce((s,r)=>s+(+r[k]||0),0)/rs.length;
}

    <button type="button" class="btn btn-g" id="btnExport">Export Backup (JSON)</button>

    <button type="button" class="btn btn-d" id="btnClear">Alle in Cloud löschen</button>
  </div>
</div>`;

  // personal link ?me= locks identity
  const reviewerEl = document.getElementById("reviewer");
  try {
    const params = new URLSearchParams(location.search);
    const me = params.get("me") || params.get("reviewer");
    if (me && REVIEWERS().includes(me)) {
      lockedReviewer = me;
      reviewerEl.value = me;
      try { localStorage.setItem(REV_KEY, me); } catch {}
      reviewerEl.disabled = true;
      if (!document.getElementById("personalLinkNote")) {
        const lockNote = document.createElement("div");
        lockNote.id = "personalLinkNote";
        lockNote.className = "meta";
        lockNote.style.marginTop = "6px";
        lockNote.innerHTML = "Persönlicher Link: <strong>" + esc(me) + "</strong> · " +
          REVIEWERS().map(r => '<a href="?me=' + encodeURIComponent(r) + '" style="color:var(--primary)">' + esc(r) + "</a>").join(" · ") +
          ' · Blind <a href="?me=' + encodeURIComponent(me) + '&blind=1" style="color:var(--primary)">an</a>/<a href="?me=' + encodeURIComponent(me) + '&blind=0" style="color:var(--primary)">aus</a>';
        reviewerEl.parentElement && reviewerEl.parentElement.appendChild(lockNote);
      }
    } else {
      lockedReviewer = null;
      const r = localStorage.getItem(REV_KEY);
      if (r && REVIEWERS().includes(r)) reviewerEl.value = r;
      reviewerEl.disabled = false;
    }
  } catch {}
  reviewerEl.onchange = () => {
    if (lockedReviewer) { reviewerEl.value = lockedReviewer; return; }
    try { localStorage.setItem(REV_KEY, reviewerEl.value); } catch {}
    if (currentTab==="rate") renderRate();
  };

  document.querySelectorAll(".tabs button").forEach(b => {
    b.onclick = () => setTab(b.dataset.tab);
  });

  document.getElementById("btnExport").onclick = async () => {
    const payload = JSON.stringify({ v:1, storage: cloudOnline?"d1":"local", ratings: state }, null, 2);
    try { await navigator.clipboard.writeText(payload); toast("Backup in Zwischenablage"); }
    catch { prompt("Kopiere Export:", payload); }
  };
  document.getElementById("btnImport").onclick = async () => {
    const raw = prompt("Export-JSON hier einfügen (wird in Cloud übernommen):");
    if (!raw) return;
    try {
      const data = JSON.parse(raw);
      const incoming = data.ratings || data;
      state = { ...state, ...incoming };
      saveRatingsLocal(state);
      const ok = await bulkPushRatings(incoming);
      toast(ok ? "Import in Cloud OK" : "Lokal importiert (Cloud offline)");
      await refreshFromCloud();
      renderRate();
    } catch { toast("Import fehlgeschlagen"); }
  };
  document.getElementById("btnClear").onclick = async () => {
    if (!confirm("Wirklich ALLE Team-Bewertungen in der Cloud löschen?")) return;
    const ok = await clearCloudRatings();
    state = {};
    saveRatingsLocal(state);
    cloudCount = 0;
    toast(ok ? "Cloud geleert" : "Lokal geleert (Cloud offline)");
    renderApp(hasOverride() ? "browser-override" : "file");
  };
  const btnRef = document.getElementById("btnRefreshCloud");
  if (btnRef) btnRef.onclick = async () => {
    toast("Lade Cloud…");
    await refreshFromCloud();
    renderApp(hasOverride() ? "browser-override" : "file");
    toast(cloudOnline ? ("Cloud: " + cloudCount + " Bewertungen") : "Cloud offline");
  };

  if (currentTab==="rate") renderRate();
  else if (currentTab==="rank") renderRank();
  else renderAdmin();
}

function renderRate(){

  root.innerHTML = VOICES().map((v,i) => {
    const key = v.id + "|" + rev;
    const mine = state[key] || Object.fromEntries([...CATS().map(c=>[c.k,0]), ["comment",""]]);
    const a = avg(mine);
    const all = voiceRatings(v.id);
    return `<article class="card" data-vid="${esc(v.id)}">
      <div class="head-row">
        <div>
          <h2>${i+1}. ${esc(v.title)}</h2>

        <div class="grid2">
          ${CATS().map(c=>`<div class="cat"><div class="cat-label">${esc(c.l)}</div>${starsHtml(+mine[c.k]||0,c.k,true)}</div>`).join("")}
        </div>
        <label class="field" style="margin-top:10px">Kommentar (optional)
          <textarea rows="2" maxlength="1000" data-comment>${esc(mine.comment||"")}</textarea>
        </label>
        <div class="actions">
          <button type="button" class="btn btn-p" data-save>Jetzt in Cloud speichern</button>
          ${state[key]?`<button type="button" class="btn btn-d" data-del>Löschen</button>`:""}
        </div>
      </div>
      <div class="team-box">
        ${teamBoxHtml(v.id, rev, cloudOnline)}
      </div>
    </article>`;
  }).join("");

  root.querySelectorAll("article").forEach(card => {
    const vid = card.dataset.vid;
    card.querySelectorAll(".stars").forEach(row => {
      row.querySelectorAll("button").forEach(btn => {
        btn.onclick = () => {
          const n = +btn.dataset.n;
          row.querySelectorAll("button[data-n]").forEach(b => {
            if (b.classList.contains("zero")) return;
            const bn = +b.dataset.n;
            b.classList.toggle("on", bn<=n && bn>0);
            b.textContent = bn<=n && bn>0 ? "★" : "☆";
          });
          row.dataset.value = String(n);
          const span = row.querySelector("span");
          if (span) span.textContent = n + "/5";
        };
      });
      const onCount = [...row.querySelectorAll("button.on")].filter(b=>!b.classList.contains("zero")).length;
      row.dataset.value = String(onCount);
    });
    const scheduleAutosave = () => {
      const revNow = document.getElementById("reviewer").value;
      const key = vid + "|" + revNow;
      clearTimeout(saveTimers[key]);
      saveTimers[key] = setTimeout(async () => {
        const payload = collectScoresFromCard(card);
        // only autosave if at least one star > 0 or existing rating
        const hasScore = CATS().some(c => +(payload[c.k]||0) > 0);
        if (!hasScore && !state[key]) return;
        await saveVoiceRating(vid, revNow, payload, { silent: true, refreshTeam: true });
        // update team box + avg without full list rebuild (keep scroll)
        const a = avg(state[vid+"|"+revNow]);
        const avgEl = card.querySelector(".head-row .avg");
        if (a != null) {
          if (avgEl) avgEl.innerHTML = a.toFixed(1) + ' <span style="font-size:.7rem;color:var(--muted)">dein Ø</span>';
          else {
            const hr = card.querySelector(".head-row");
            if (hr) {
              const d = document.createElement("div");
              d.className = "avg";
              d.innerHTML = a.toFixed(1) + ' <span style="font-size:.7rem;color:var(--muted)">dein Ø</span>';
              hr.appendChild(d);
            }
          }
        }
        // refresh team section HTML for this card only
        const all = voiceRatings(vid);
        const team = card.querySelector(".team-box");
        if (team) {
          team.innerHTML = teamBoxHtml(vid, revNow, cloudOnline);
        }
        // subtle status under actions
        let st = card.querySelector("[data-sync-status]");
        if (!st) {
          st = document.createElement("div");
          st.dataset.syncStatus = "1";
          st.style.cssText = "font-size:.75rem;margin-top:8px;color:var(--muted)";
          card.querySelector(".actions")?.after(st);
        }
        st.textContent = cloudOnline ? "✓ In Cloud-DB fürs Team sichtbar" : "⚠ Nur lokal gespeichert";
        st.style.color = cloudOnline ? "#34d399" : "var(--star)";
      }, 500);
    };

    card.querySelectorAll(".stars").forEach(row => {
      row.querySelectorAll("button").forEach(btn => {
        const prev = btn.onclick;
        btn.addEventListener("click", () => scheduleAutosave());
      });
    });
    const ta = card.querySelector("[data-comment]");
    if (ta) {
      ta.addEventListener("change", () => scheduleAutosave());
      ta.addEventListener("blur", () => scheduleAutosave());
    }

    card.querySelector("[data-save]").onclick = async () => {
      const revNow = document.getElementById("reviewer").value;
      const payload = collectScoresFromCard(card);
      await saveVoiceRating(vid, revNow, payload, { silent: false, refreshTeam: true });
      renderRate();
    };
    const del = card.querySelector("[data-del]");
    if (del) del.onclick = async () => {
      const revNow = document.getElementById("reviewer").value;
      delete state[vid+"|"+revNow];
      saveRatingsLocal(state);
      await deleteCloudRating(vid, revNow);
      const cloud = await fetchCloudRatings();
      if (cloud) { state = cloud; saveRatingsLocal(state); cloudCount = Object.keys(state).length; }
      toast("Gelöscht");
      renderRate();
    };
  });
}


function getActiveFilters(){
  return {
    minAvg,
    sexFilter,
    langFilter,
    highOnly,
    selectedVoiceIds: selectedVoices.slice(),
  };
}

function getFilteredRankRows(){
  let rows = VOICES().map(v => ({ v, ta: teamAvg(v.id), n: voiceRatings(v.id).length }));
  if (sexFilter !== "all") rows = rows.filter(r => r.v.sex === sexFilter);
  if (langFilter !== "all") rows = rows.filter(r => r.v.lang === langFilter);
  if (selectedVoices.length) rows = rows.filter(r => selectedVoices.includes(r.v.id));
  if (highOnly) rows = rows.filter(r => r.ta != null && r.ta >= 4);
  if (minAvg > 0) rows = rows.filter(r => r.ta != null && r.ta >= minAvg);
  rows.sort((a,b) => (b.ta??-1) - (a.ta??-1));
  return rows;
}

function buildFilteredRankingExport(rows){
  const filters = getActiveFilters();
  return {
    v: 1,
    type: "filtered_ranking",
    exportedAt: new Date().toISOString(),
    filters,
    count: rows.length,
    ranking: rows.map((row, i) => {
      const cats = {};
      CATS().forEach(c => { cats[c.k] = catAvg(row.v.id, c.k); });
      return {
        rank: i + 1,
        id: row.v.id,
        title: row.v.title,
        sex: row.v.sex,
        lang: row.v.lang || null,
        note: row.v.note || "",
        tags: row.v.tags || [],
        audio: row.v.audio,
        teamAvg: row.ta,
        ratingCount: row.n,
        categories: cats,
        ratings: voiceRatings(row.v.id),
      };
    }),
  };
}

function rankingToCsv(rows){
  const catKeys = CATS().map(c => c.k);
  const headers = ["rank","id","title","sex","lang","teamAvg","ratingCount",...catKeys,"audio","note"];
  const lines = [headers.join(",")];
  rows.forEach((row, i) => {
    const cats = catKeys.map(k => {
      const v = catAvg(row.v.id, k);
      return v == null ? "" : v.toFixed(2);
    });
    const cells = [
      i + 1,
      row.v.id,
      JSON.stringify(row.v.title || ""),
      row.v.sex || "",
      row.v.lang || "",
      row.ta == null ? "" : row.ta.toFixed(2),
      row.n,
      ...cats,
      JSON.stringify(row.v.audio || ""),
      JSON.stringify(row.v.note || ""),
    ];
    lines.push(cells.join(","));
  });
  return lines.join("\n");
}

function downloadText(filename, text, mime){
  const blob = new Blob([text], { type: mime || "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

async function exportFilteredRanking(format){
  const rows = getFilteredRankRows();
  if (!rows.length) {
    toast("Keine Stimmen mit aktuellen Filtern — nichts zu exportieren");
    return;
  }
  const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,"-");
  if (format === "csv") {
    const csv = rankingToCsv(rows);
    downloadText("ranking-filter-" + stamp + ".csv", csv, "text/csv;charset=utf-8");
    try { await navigator.clipboard.writeText(csv); toast(rows.length + " Stimmen als CSV exportiert (+ Zwischenablage)"); }
    catch { toast(rows.length + " Stimmen als CSV heruntergeladen"); }
    return;
  }
  const payload = JSON.stringify(buildFilteredRankingExport(rows), null, 2);
  downloadText("ranking-filter-" + stamp + ".json", payload, "application/json");
  try { await navigator.clipboard.writeText(payload); toast(rows.length + " gefilterte Stimmen exportiert (JSON + Zwischenablage)"); }
  catch { toast(rows.length + " gefilterte Stimmen als JSON heruntergeladen"); }
}

  <strong>Für Agenten (Claude / Grok / OpenAI / Hermes)</strong>
  <p class="help">Im Repo: <code>agents/SKILL.md</code> + <code>mcp/server.mjs</code>. Workflow: Stimme via Fish TTS erzeugen → <code>audio</code>-URL + <code>id</code> in <code>config.json</code> eintragen → deploy.</p>
  <pre class="muted-code" style="white-space:pre-wrap;background:var(--bg);padding:10px;border-radius:8px;border:1px solid var(--border)"># Stimme hinzufügen (manuell)
1. Fish Audio TTS mit voice_id + script
2. MP3-URL + voice_id in config.json unter voices[]
3. commit & deploy → live auf ${esc(CONFIG.project.liveUrl||"")}</pre>
</div>`;

  const persistDraft = (cfg) => {
    const errs = validateConfig(cfg);
    if (errs.length) { toast("Ungültig: " + errs[0]); return false; }
    saveOverride(cfg);
    applyConfig(cfg, "browser-override");
    toast("Als Browser-Entwurf gespeichert — Config exportieren zum Committen");
    return true;
  };

  document.getElementById("btnSaveVoice").onclick = () => {
    const title = document.getElementById("fTitle").value.trim();
    let id = document.getElementById("fId").value.trim();
    const sex = document.getElementById("fSex").value;
    const audio = document.getElementById("fAudio").value.trim();
    const note = document.getElementById("fNote").value.trim();
    const tags = document.getElementById("fTags").value.split(",").map(s=>s.trim()).filter(Boolean);
    if (!title || !audio) { toast("Titel und Audio-URL nötig"); return; }
    if (!id) id = "voice-" + Date.now().toString(36);
    const cfg = clone(CONFIG);
    if (editId) {
      const idx = cfg.voices.findIndex(v => v.id === editId);
      if (idx < 0) { toast("Stimme nicht gefunden"); return; }
      cfg.voices[idx] = { ...cfg.voices[idx], title, sex, audio, note, tags, id: editId };
      editId = null;
    } else {
      if (cfg.voices.some(v => v.id === id)) { toast("ID existiert bereits"); return; }
      cfg.voices.push({ id, title, sex, audio, note, tags });
    }
    persistDraft(cfg);
    currentTab = "admin";
    setTab("admin");
  };

  const cancel = document.getElementById("btnCancelEdit");
  if (cancel) cancel.onclick = () => { editId = null; renderAdmin(); };

  document.getElementById("btnSaveMeta").onclick = () => {
    const script = document.getElementById("fScript").value.trim();
    const reviewers = document.getElementById("fReviewers").value.split(",").map(s=>s.trim()).filter(Boolean);
    if (!script || !reviewers.length) { toast("Skript und mind. 1 Reviewer"); return; }
    const cfg = clone(CONFIG);
    cfg.script = script;
    cfg.reviewers = reviewers;
    persistDraft(cfg);
    currentTab = "admin";
    setTab("admin");
  };

  root.querySelectorAll(".va-card").forEach(card => {
    const id = card.dataset.id;
    card.querySelector("[data-edit]").onclick = () => { editId = id; renderAdmin(); };
    card.querySelector("[data-rm]").onclick = () => {
      if (!confirm("Stimme entfernen?")) return;
      const cfg = clone(CONFIG);
      cfg.voices = cfg.voices.filter(v => v.id !== id);
      if (!cfg.voices.length) { toast("Mindestens 1 Stimme behalten"); return; }
      if (editId === id) editId = null;
      persistDraft(cfg);
      currentTab = "admin";
      setTab("admin");
    };
    card.querySelector("[data-up]").onclick = () => {
      const cfg = clone(CONFIG);
      const i = cfg.voices.findIndex(v => v.id === id);
      if (i <= 0) return;
      [cfg.voices[i-1], cfg.voices[i]] = [cfg.voices[i], cfg.voices[i-1]];
      persistDraft(cfg);
      currentTab = "admin";
      setTab("admin");
    };
    card.querySelector("[data-down]").onclick = () => {
      const cfg = clone(CONFIG);
      const i = cfg.voices.findIndex(v => v.id === id);
      if (i < 0 || i >= cfg.voices.length-1) return;
      [cfg.voices[i], cfg.voices[i+1]] = [cfg.voices[i+1], cfg.voices[i]];
      persistDraft(cfg);
      currentTab = "admin";
      setTab("admin");
    };
  });

  const download = (filename, text) => {
    const blob = new Blob([text], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
  };

  document.getElementById("btnExportCfg").onclick = () => {
    download("config.json", JSON.stringify(CONFIG, null, 2));
    toast("config.json heruntergeladen");
  };
  document.getElementById("btnCopyCfg").onclick = async () => {
    const text = JSON.stringify(CONFIG, null, 2);
    try { await navigator.clipboard.writeText(text); toast("Config kopiert"); }
    catch { prompt("Config:", text); }
  };
  document.getElementById("btnImportCfg").onclick = () => {
    const raw = prompt("Gesamte config.json hier einfügen:");
    if (!raw) return;
    try {
      const cfg = JSON.parse(raw);
      if (!cfg.version) cfg.version = 1;
      persistDraft(cfg);
      currentTab = "admin";
      setTab("admin");
    } catch (e) { toast("JSON-Fehler: " + e.message); }
  };
  const reset = document.getElementById("btnResetCfg");
  if (reset) reset.onclick = () => {
    if (!confirm("Browser-Entwurf verwerfen und config.json laden?")) return;
    clearOverride();
    editId = null;
    applyConfig(clone(FILE_CONFIG), "file");
    currentTab = "admin";
    setTab("admin");
    toast("Zurück zu config.json");
  };
}

boot();
</script>
</body>
</html>
