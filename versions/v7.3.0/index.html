<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Voice Compare · v7</title>
<style>

:root{--bg:#0b0f14;--surface:#141a22;--s2:#1b2330;--fg:#eef2f7;--muted:#8b98ab;--border:#2a3545;--primary:#2f9bfd;--pfg:#041018;--accent:#3dd6c6;--star:#f5c542;--male:#7dd3fc;--female:#f0abfc;--danger:#f87171;--ok:#34d399}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(1000px 480px at 8% -8%,rgb(30 58 95/.45),transparent 55%),var(--bg);color:var(--fg);line-height:1.5}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px 80px}
header{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px}
h1{margin:0 0 6px;font-size:1.35rem}
.sub{color:var(--muted);font-size:.9rem;margin:0}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:end}
label.field{display:flex;flex-direction:column;gap:4px;font-size:.75rem;color:var(--muted);flex:1;min-width:140px}
select,textarea,input{background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font:inherit}
select{height:42px}
.tabs{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:12px;margin-top:14px;flex-wrap:wrap}
.tabs button{flex:1;min-width:90px;border:0;background:transparent;color:var(--muted);padding:10px;border-radius:10px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--primary);color:var(--pfg)}
.script{margin-top:12px;padding:10px 12px;background:#0a1018;border-left:3px solid var(--accent);border-radius:8px;font-size:.8rem;color:#c9d4e6;word-break:break-word}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin:12px 0}
.card h2{margin:0 0 4px;font-size:1.05rem}
.meta{color:var(--muted);font-size:.88rem}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tag{font-size:.72rem;padding:2px 8px;border-radius:999px;border:1px solid var(--border);background:var(--s2);color:var(--muted)}
.tag.m{color:var(--male);border-color:#1e4a66}
.tag.f{color:var(--female);border-color:#5b2d6b}
audio{width:100%;margin:8px 0 12px}
.cat{margin:8px 0}
.cat-label{font-size:.75rem;color:var(--muted);margin-bottom:2px}
.stars{display:flex;align-items:center;gap:2px}
.stars button{background:none;border:0;cursor:pointer;font-size:1.25rem;line-height:1;padding:2px 3px;color:var(--border)}
.stars button.on{color:var(--star)}
.stars .zero{font-size:.7rem;color:var(--muted);margin-right:4px}
.avg{font-weight:700;color:var(--star);font-size:1.1rem}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}
.btn-p{background:var(--primary);color:var(--pfg)}
.btn-g{background:var(--s2);color:var(--fg);border:1px solid var(--border)}
.btn-d{background:transparent;color:var(--danger);border:1px solid var(--border)}
.btn-ok{background:rgb(52 211 153/.15);color:var(--ok);border:1px solid rgb(52 211 153/.35)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.team-box{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.team-box h3{margin:0 0 8px;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.rating-row{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:10px;margin:6px 0;font-size:.88rem}
.rating-row.pending{border-style:dashed;color:var(--muted)}
.filters{display:grid;gap:10px;grid-template-columns:1fr 1fr 1fr}
@media(max-width:560px){.filters{grid-template-columns:1fr}}
.chip{border:1px solid var(--border);background:var(--s2);color:var(--muted);border-radius:999px;padding:5px 10px;font-size:.75rem;cursor:pointer}
.chip.on{border-color:var(--primary);background:rgb(47 155 253/.15);color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.rank-num{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;background:var(--s2)}
.rank-num.gold{background:rgb(245 197 66/.2);color:var(--star)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--s2);border:1px solid var(--border);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:50;display:none;max-width:90vw}
.note{font-size:.78rem;color:var(--muted);margin-top:10px;padding:8px 10px;background:var(--bg);border-radius:8px;border:1px solid var(--border)}
.grid2{display:grid;gap:8px;grid-template-columns:1fr 1fr}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.head-row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.badge{font-size:.7rem;padding:2px 8px;border-radius:999px;border:1px solid var(--border);color:var(--muted)}
.badge.live{border-color:rgb(52 211 153/.4);color:var(--ok)}
.badge.draft{border-color:rgb(245 197 66/.4);color:var(--star)}
.voice-admin{display:grid;gap:10px}
.voice-admin .va-card{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px}
.voice-admin .va-head{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.muted-code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.75rem;color:var(--muted);word-break:break-all}
.form-grid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media(max-width:560px){.form-grid{grid-template-columns:1fr}}
.form-grid .full{grid-column:1/-1}
.help{font-size:.78rem;color:var(--muted);margin:0 0 10px}
.loading{padding:40px;text-align:center;color:var(--muted)}

.pager{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:12px 0}
.pager .pages{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pager button{min-width:36px}
.pager button.on{background:var(--primary);color:var(--pfg);border-color:var(--primary)}
.toolbar{display:grid;gap:10px;grid-template-columns:2fr 1fr 1fr 1fr;margin-bottom:12px}
@media(max-width:720px){.toolbar{grid-template-columns:1fr 1fr}}
.role-badge{font-size:.7rem;font-weight:800;padding:3px 8px;border-radius:999px;border:1px solid var(--border)}
.role-main{background:rgb(47 155 253/.15);color:var(--primary)}
.role-tester{background:rgb(61 214 198/.12);color:var(--accent)}
.user-row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:var(--bg)}
.vote-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.vote-pill{font-size:.72rem;padding:3px 8px;border-radius:999px;background:var(--s2);border:1px solid var(--border)}
.vote-pill.yes{border-color:var(--danger);color:var(--danger)}
.archived-tag{color:var(--danger);font-weight:700;font-size:.75rem}
.version-bar{font-size:.72rem;color:var(--muted);margin-top:6px}
.link-box{font-family:ui-monospace,monospace;font-size:.75rem;word-break:break-all;background:var(--bg);border:1px solid var(--border);padding:8px;border-radius:8px}

.boot{padding:40px;text-align:center;color:var(--muted);font-size:1rem}
</style>
</head>
<body>
<div id="toast" class="toast" style="display:none"></div>
<div id="boot" class="boot">Lade…</div>
<div id="app"></div>
<script>

const APP_VERSION = "7.3.0";
const EMBEDDED_CONFIG = null; // always prefer config.json from worker pin
const RATE_KEY = "bs-voice-ratings-v1";
const REV_KEY = "bs-voice-reviewer";
const UI_KEY = "bs-voice-ui-v7";
const BLIND_KEY = "bs-voice-blind";
const CFG_KEY = "bs-voice-cfg-override";
const API_BASE = "";
const PAGE_SIZE = 10;

let CONFIG = null, FILE_CONFIG = null, state = {};
let currentUser = null; // {name, role, token, id}
let lockedReviewer = null;
let cloudOnline = false, cloudCount = 0;
let archivedIds = new Set();
let archivePending = {}; // voice_id -> [{voter,ts}]
let usersList = [];
let currentTab = "rate";
let editId = null;
let saveTimers = {}, pollTimer = null;
let selectedVoices = [];
let minAvg = 0, sexFilter = "all", langFilter = "all", highOnly = false;

function defaultUi() {
  return { page: 1, q: "", group: "all", sex: "all", sort: "default", scrollY: 0, tab: "rate" };
}
function loadUi() {
  try { return { ...defaultUi(), ...JSON.parse(sessionStorage.getItem(UI_KEY) || "{}") }; }
  catch { return defaultUi(); }
}
function saveUi( partial ) {
  const u = { ...loadUi(), ...partial };
  try { sessionStorage.setItem(UI_KEY, JSON.stringify(u)); } catch {}
  return u;
}
function ui() { return loadUi(); }

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 2600);
}
function esc(s) {
  return String(s ?? "").replace(/&/g,"&").replace(/</g,"<").replace(/>/g,">").replace(/"/g,""");
}
function blindEnabled() {
  try {
    const q = new URLSearchParams(location.search).get("blind");
    if (q === "0") return false;
    if (q === "1") return true;
    const s = localStorage.getItem(BLIND_KEY);
    if (s === "0") return false;
  } catch {}
  return true;
}
function isMain() { return currentUser?.role === "main"; }
function isTester() { return currentUser?.role === "tester"; }
function authHeaders(extra = {}) {
  const h = { "content-type": "application/json", ...extra };
  if (currentUser?.token) h["x-user-token"] = currentUser.token;
  if (currentUser?.name) h["x-reviewer"] = currentUser.name;
  return h;
}
function authQuery() {
  if (currentUser?.token) return "u=" + encodeURIComponent(currentUser.token);
  if (currentUser?.name) return "me=" + encodeURIComponent(currentUser.name);
  return "";
}

function loadRatings() { try { return JSON.parse(localStorage.getItem(RATE_KEY) || "{}"); } catch { return {}; } }
function saveRatingsLocal(data) { try { localStorage.setItem(RATE_KEY, JSON.stringify(data)); } catch {} }

async function api(path, opts = {}) {
  const q = authQuery();
  const url = API_BASE + path + (path.includes("?") ? "&" : "?") + "_=" + Date.now() + (q ? "&" + q : "");
  const res = await fetch(url, { cache: "no-store", ...opts, headers: { ...authHeaders(opts.headers || {}) } });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
  return data;
}

async function fetchCloudRatings() {
  try {
    const data = await api("/api/ratings");
    cloudOnline = true;
    cloudCount = data.count ?? Object.keys(data.ratings || {}).length;
    if (Array.isArray(data.archivedIds)) archivedIds = new Set(data.archivedIds);
    return data.ratings || {};
  } catch (e) {
    console.warn(e);
    cloudOnline = false;
    return null;
  }
}

async function pushRating(voiceId, reviewer, payload) {
  try {
    if (lockedReviewer && reviewer !== lockedReviewer) { toast("Name gesperrt"); return false; }
    await api("/api/ratings", {
      method: "PUT",
      body: JSON.stringify({
        voice_id: voiceId, reviewer,
        pron: +(payload.pron||0), prof: +(payload.prof||0), warm: +(payload.warm||0),
        clar: +(payload.clar||0), emo: +(payload.emo||0),
        comment: payload.comment || "", ts: payload.ts || Date.now(),
      }),
    });
    cloudOnline = true;
    return true;
  } catch (e) {
    console.warn(e);
    cloudOnline = false;
    toast(e.message || "Cloud save failed");
    return false;
  }
}

async function deleteCloudRating(voiceId, reviewer) {
  try {
    await api("/api/ratings?voice_id=" + encodeURIComponent(voiceId) + "&reviewer=" + encodeURIComponent(reviewer), { method: "DELETE" });
    return true;
  } catch { return false; }
}

async function bulkPushRatings(map) {
  try {
    await api("/api/ratings/bulk", { method: "PUT", body: JSON.stringify({ ratings: map }) });
    return true;
  } catch { return false; }
}

async function clearCloudRatings() {
  const key = prompt("Admin-Key zum Löschen ALLER Cloud-Bewertungen:");
  if (!key) return false;
  try {
    await api("/api/ratings?all=1", { method: "DELETE", headers: { "x-admin-key": key } });
    return true;
  } catch (e) { toast(e.message); return false; }
}

async function refreshFromCloud() {
  const cloud = await fetchCloudRatings();
  if (!cloud) return false;
  state = cloud;
  saveRatingsLocal(state);
  cloudCount = Object.keys(state).length;
  return true;
}

async function loadMe() {
  try {
    const data = await api("/api/me");
    if (data.ok && data.user) {
      currentUser = data.user;
      lockedReviewer = data.user.name;
      try { localStorage.setItem(REV_KEY, data.user.name); } catch {}
      return data.user;
    }
  } catch {}
  // fallback from URL without server
  const params = new URLSearchParams(location.search);
  const me = params.get("me") || params.get("reviewer");
  const tok = params.get("u") || params.get("token");
  if (me) {
    currentUser = { name: me, role: ["Arman","Denis","Osoba 3"].includes(me) ? "main" : "tester", token: tok || "", via: "me" };
    lockedReviewer = me;
  }
  return currentUser;
}

async function loadUsers() {
  if (!currentUser) { usersList = []; return; }
  try {
    const data = await api("/api/users");
    usersList = data.users || [];
  } catch { usersList = []; }
}

async function loadArchive() {
  if (!isMain()) { archivePending = {}; return; }
  try {
    const data = await api("/api/archive");
    archivePending = data.pending || {};
    archivedIds = new Set((data.archived || []).map(a => a.voice_id));
  } catch {}
}

function storageBadgeHtml() {
  if (cloudOnline) {
    return `<span style="display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:999px;background:rgb(52 211 153/.12);border:1px solid rgb(52 211 153/.35);color:#34d399">● Cloud-DB live · ${cloudCount} Bewertungen · v${APP_VERSION}</span>`;
  }
  return `<span style="display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:999px;background:rgb(245 197 66/.12);border:1px solid rgb(245 197 66/.35);color:var(--star)">○ Offline · nur Browser</span>`;
}

function CATS(){ return CONFIG.categories; }
function REVIEWERS(){
  // main names + active testers for display of team boxes (main only sees all)
  if (isMain() && usersList.length) return usersList.map(u => u.name);
  return CONFIG.reviewers;
}
function VOICES(){ return CONFIG.voices || []; }
function activeVoices() {
  return VOICES().filter(v => !archivedIds.has(v.id));
}
function avg(r) {
  if (!r) return null;
  const v = CATS().map(c => +r[c.k] || 0);
  return v.reduce((a,b)=>a+b,0) / v.length;
}
function hasMyRating(vid, rev) {
  const r = state[vid + "|" + rev];
  if (!r) return false;
  return CATS().some(c => +(r[c.k]||0) > 0) || !!(r.comment||"").trim();
}
function voiceRatings(vid) {
  const out = [];
  for (const rev of REVIEWERS()) {
    const key = vid + "|" + rev;
    if (state[key]) out.push({ reviewer: rev, ...state[key] });
  }
  return out;
}
function teamAvg(vid) {
  const rs = voiceRatings(vid);
  if (!rs.length) return null;
  return rs.map(avg).reduce((a,b)=>a+b,0)/rs.length;
}
function catAvg(vid,k) {
  const rs = voiceRatings(vid);
  if (!rs.length) return null;
  return rs.reduce((s,r)=>s+(+r[k]||0),0)/rs.length;
}
function starsHtml(value, name, editable) {
  let h = `<div class="stars" data-name="${esc(name)}">`;
  if (editable) h += `<button type="button" class="zero" data-n="0" title="0">0</button>`;
  for (let n=1;n<=5;n++) {
    h += `<button type="button" class="${n<=value?"on":""}" data-n="${n}" ${editable?"":"disabled"}>${n<=value?"★":"☆"}</button>`;
  }
  h += `<span style="margin-left:6px;font-size:.75rem;color:var(--muted)">${value}/5</span></div>`;
  return h;
}
function teamBoxHtml(vid, rev, cloudOnlineFlag) {
  const all = voiceRatings(vid);
  const mineDone = hasMyRating(vid, rev);
  const blind = blindEnabled() && !mineDone;
  if (blind) {
    return `<h3>Team-Wertungen (Blind)</h3>
      <p class="meta" style="margin:0">Peer-Scores versteckt, bis <strong>du</strong> speicherst.</p>
      <div class="rating-row pending"><strong>${esc(rev)}</strong> — ausstehend</div>`;
  }
  // testers: after own rating, show averages only (not others' comments if we want strict) — show team like main
  return `<h3>Team-Wertungen (${all.length})${cloudOnlineFlag?"":" · ⚠ offline"}</h3>
    ${all.length?"":`<p class="meta">Noch keine Bewertungen.</p>`}
    ${all.map(r => {
      const av = avg(r);
      return `<div class="rating-row"><div style="display:flex;justify-content:space-between"><strong>${esc(r.reviewer)}</strong><span class="avg" style="font-size:.95rem">Ø ${av.toFixed(2)}</span></div>
        <div class="grid2" style="margin-top:6px">${CATS().map(c=>`<div style="font-size:.75rem;display:flex;justify-content:space-between"><span class="meta">${esc(c.s)}</span><span>${r[c.k]}/5</span></div>`).join("")}</div>
        ${r.comment?`<div style="margin-top:6px;font-size:.85rem">„${esc(r.comment)}“</div>`:""}
      </div>`;
    }).join("")}`;
}

function collectScoresFromCard(card) {
  const scores = {};
  card.querySelectorAll(".stars").forEach(row => { scores[row.dataset.name] = +(row.dataset.value || 0); });
  const comment = card.querySelector("[data-comment]")?.value || "";
  return { ...scores, comment };
}

async function saveVoiceRating(vid, rev, payload, { silent=false } = {}) {
  const full = { ...payload, ts: Date.now() };
  state[vid + "|" + rev] = full;
  saveRatingsLocal(state);
  const ok = await pushRating(vid, rev, full);
  if (ok) {
    const cloud = await fetchCloudRatings();
    if (cloud) {
      for (const [k,v] of Object.entries(cloud)) {
        const loc = state[k];
        if (!loc || (v.ts||0) >= (loc.ts||0)) state[k] = v;
      }
      saveRatingsLocal(state);
      cloudCount = Object.keys(state).length;
    }
  }
  if (!silent) toast(ok ? ("✓ In Cloud · " + rev) : ("⚠ Nur lokal · " + rev));
  return ok;
}

function updateCardAfterSave(card, vid, rev) {
  const a = avg(state[vid+"|"+rev]);
  const avgEl = card.querySelector(".head-row .avg");
  if (a != null) {
    if (avgEl) avgEl.innerHTML = a.toFixed(1) + ' <span style="font-size:.7rem;color:var(--muted)">dein Ø</span>';
    else {
      const hr = card.querySelector(".head-row");
      if (hr) {
        const d = document.createElement("div");
        d.className = "avg";
        d.innerHTML = a.toFixed(1) + ' <span style="font-size:.7rem;color:var(--muted)">dein Ø</span>';
        hr.appendChild(d);
      }
    }
  }
  const team = card.querySelector(".team-box");
  if (team) team.innerHTML = teamBoxHtml(vid, rev, cloudOnline);
  let st = card.querySelector("[data-sync-status]");
  if (!st) {
    st = document.createElement("div");
    st.dataset.syncStatus = "1";
    st.style.cssText = "font-size:.75rem;margin-top:8px;color:var(--muted)";
    card.querySelector(".actions")?.after(st);
  }
  st.textContent = cloudOnline ? "✓ In Cloud-DB · Seite & Scroll bleiben" : "⚠ Nur lokal";
  st.style.color = cloudOnline ? "#34d399" : "var(--star)";
  // show delete if rated
  const actions = card.querySelector(".actions");
  if (actions && state[vid+"|"+rev] && !card.querySelector("[data-del]")) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "btn btn-d"; b.dataset.del = "1"; b.textContent = "Löschen";
    actions.appendChild(b);
    b.onclick = async () => {
      delete state[vid+"|"+rev];
      saveRatingsLocal(state);
      await deleteCloudRating(vid, rev);
      const cloud = await fetchCloudRatings();
      if (cloud) { state = { ...state, ...cloud }; saveRatingsLocal(state); }
      toast("Gelöscht");
      // soft refresh card scores without page jump
      renderRate(true);
    };
  }
}

function getFilteredRateVoices() {
  const u = ui();
  let list = activeVoices().slice();
  if (u.group !== "all") list = list.filter(v => (v.group || v.lang) === u.group || v.lang === u.group);
  if (u.sex !== "all") list = list.filter(v => v.sex === u.sex);
  if (u.q) {
    const q = u.q.toLowerCase();
    list = list.filter(v =>
      (v.title||"").toLowerCase().includes(q) ||
      (v.note||"").toLowerCase().includes(q) ||
      (v.id||"").toLowerCase().includes(q) ||
      (v.tags||[]).some(t => String(t).toLowerCase().includes(q))
    );
  }
  if (u.sort === "title") list.sort((a,b) => (a.title||"").localeCompare(b.title||""));
  else if (u.sort === "group") list.sort((a,b) => String(a.group||a.lang||"").localeCompare(String(b.group||b.lang||"")));
  else if (u.sort === "unrated") {
    const rev = currentUser?.name || REVIEWERS()[0];
    list.sort((a,b) => (hasMyRating(a.id,rev)?1:0) - (hasMyRating(b.id,rev)?1:0));
  } else if (u.sort === "avg") {
    list.sort((a,b) => (teamAvg(b.id)??-1) - (teamAvg(a.id)??-1));
  }
  return list;
}

function pageSlice(list) {
  const u = ui();
  const total = list.length;
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  let page = Math.min(Math.max(1, u.page || 1), pages);
  if (page !== u.page) saveUi({ page });
  const start = (page - 1) * PAGE_SIZE;
  return { page, pages, total, slice: list.slice(start, start + PAGE_SIZE), start };
}

function pagerHtml(page, pages, total) {
  if (pages <= 1) return `<div class="pager"><span class="meta">${total} Stimmen · ${PAGE_SIZE}/Seite</span></div>`;
  let buttons = "";
  for (let p = 1; p <= pages; p++) {
    if (pages > 12 && Math.abs(p - page) > 2 && p !== 1 && p !== pages) {
      if (p === 2 || p === pages - 1) buttons += `<span class="meta">…</span>`;
      continue;
    }
    buttons += `<button type="button" class="btn btn-g ${p===page?"on":""}" data-page="${p}">${p}</button>`;
  }
  return `<div class="pager">
    <span class="meta">Seite ${page}/${pages} · ${total} Stimmen · je ${PAGE_SIZE}</span>
    <div class="pages">
      <button type="button" class="btn btn-g" data-page="${Math.max(1,page-1)}" ${page<=1?"disabled":""}>←</button>
      ${buttons}
      <button type="button" class="btn btn-g" data-page="${Math.min(pages,page+1)}" ${page>=pages?"disabled":""}>→</button>
    </div>
  </div>`;
}

function bindPager(root) {
  root.querySelectorAll("[data-page]").forEach(btn => {
    btn.onclick = () => {
      const p = +btn.dataset.page;
      saveUi({ page: p, scrollY: 0 });
      window.scrollTo(0, 0);
      renderRate();
    };
  });
}

function getFilteredRankRows() {
  let rows = activeVoices().map(v => ({ v, ta: teamAvg(v.id), n: voiceRatings(v.id).length }));
  if (sexFilter !== "all") rows = rows.filter(r => r.v.sex === sexFilter);
  if (langFilter !== "all") rows = rows.filter(r => {
    if (langFilter === "agent") return r.v.group === "agent";
    return (r.v.lang === langFilter || r.v.group === langFilter);
  });
  if (selectedVoices.length) rows = rows.filter(r => selectedVoices.includes(r.v.id));
  if (highOnly) rows = rows.filter(r => r.ta != null && r.ta >= 4);
  if (minAvg > 0) rows = rows.filter(r => r.ta != null && r.ta >= minAvg);
  rows.sort((a,b) => (b.ta??-1) - (a.ta??-1));
  return rows;
}

          <strong>${esc(v?.title || id)}</strong>
          <div class="meta">${ratings.length} Bewertungen gespeichert · ID ${esc(id)}</div>
        </div>
        <button type="button" class="btn btn-g" data-restore="${esc(id)}">Wiederherstellen</button>
      </div>`;
    }).join("") : `<p class="meta">Leer</p>`}
  </div>
  <div class="card"><strong>Offene Archiv-Stimmen</strong>
    ${pendingIds.length ? pendingIds.map(id => {
      const v = VOICES().find(x => x.id === id);
      const votes = archivePending[id] || [];
      return `<div class="user-row"><div><strong>${esc(v?.title||id)}</strong>
        <div class="vote-bar">${votes.map(x=>`<span class="vote-pill yes">${esc(x.voter)}</span>`).join("")} (${votes.length}/2)</div>
      </div></div>`;
    }).join("") : `<p class="meta">Keine offenen Votes</p>`}
  </div>
  <div class="card"><strong>Audit-Historie (letzte 50)</strong>
    <div style="max-height:280px;overflow:auto;font-size:.8rem">
      ${audit.slice(0,50).map(e => `<div class="meta" style="padding:4px 0;border-bottom:1px solid var(--border)">
        ${new Date(e.ts).toLocaleString()} · <strong>${esc(e.actor)}</strong> · ${esc(e.action)} · ${esc(e.voice_id)} ${esc(e.detail)}
      </div>`).join("") || "—"}
    </div>
  </div>`;

  root.querySelectorAll("[data-restore]").forEach(btn => {
    btn.onclick = async () => {
      if (!confirm("Voice aus Archiv holen?")) return;
      try {
        await api("/api/archive/restore", { method: "POST", body: JSON.stringify({ voice_id: btn.dataset.restore }) });
        toast("Wiederhergestellt");
        await loadArchive();
        await fetchCloudRatings();
        renderArchive();
      } catch (e) { toast(e.message); }
    };
  });
}

function loadOverride(){ try{const raw=localStorage.getItem(CFG_KEY);return raw?JSON.parse(raw):null}catch{return null} }
function saveOverride(cfg){ localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }
function clearOverride(){ localStorage.removeItem(CFG_KEY); }
function hasOverride(){ return !!localStorage.getItem(CFG_KEY); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function persistDraft(cfg){ saveOverride(cfg); applyConfig(cfg, "browser-override"); toast("Browser-Entwurf gespeichert"); }
function emptyVoice(){ return { id:"", title:"", sex:"m", note:"", tags:[], audio:"" }; }

function validateConfig(cfg) {
  const errs = [];
  if (!cfg?.project?.title) errs.push("project.title fehlt");
  if (!cfg.script) errs.push("script fehlt");
  if (!Array.isArray(cfg.reviewers) || !cfg.reviewers.length) errs.push("reviewers[] leer");
  if (!Array.isArray(cfg.categories) || !cfg.categories.length) errs.push("categories[] leer");
  if (!Array.isArray(cfg.voices) || !cfg.voices.length) errs.push("voices[] leer");
  return errs;
}

function applyConfig(cfg, source) {
  const errs = validateConfig(cfg);
  if (errs.length) throw new Error(errs.join("; "));
  CONFIG = cfg;
  if (!state || typeof state !== "object") state = loadRatings();
  document.title = cfg.project.title + " · v" + APP_VERSION;
  renderApp();
}


let phoneticCache = { list: [], map: {}, fishKey: false, loaded: false };

async function loadPhonetic(force) {
  if (phoneticCache.loaded && !force) return phoneticCache;
  try {
    const d = await api("/api/phonetic");
    phoneticCache = {
      list: d.list || [],
      map: d.results || {},
      fishKey: !!d.fishKey,
      loaded: true,
    };
  } catch (e) {
    console.warn(e);
    toast(e.message || "Phonetik laden fehlgeschlagen");
    phoneticCache.loaded = true;
  }
  return phoneticCache;
}

function expectedScriptForVoice(v) {
  const g = v.group || "";
  if (g === "bs-interview") {
    if ((v.variant || "").includes("formal") || (v.id || "").includes("iv-formal") || (v.title || "").toLowerCase().includes("formal")) {
      return CONFIG.script_interview_formal || CONFIG.script_tts_bs || CONFIG.script || "";
    }
    return CONFIG.script_interview_warm || CONFIG.script_tts_bs || CONFIG.script || "";
  }
  if (g === "bs-clone" || g === "bs" || (v.lang || "") === "bs") {
    return CONFIG.script_tts_bs || CONFIG.script || "";
  }
  if ((v.lang || "") === "en") return CONFIG.script_tts_en || CONFIG.script_en || "";
  return CONFIG.script_tts_bs || CONFIG.script || "";
}

function scoreBadge(score) {
  const s = Number(score) || 0;
  const col = s >= 85 ? "var(--ok,#3ecf8e)" : s >= 70 ? "var(--accent,#6ea8fe)" : s >= 50 ? "#e6b84d" : "#e35d6a";
  return `<span style="display:inline-block;min-width:3.2rem;text-align:center;padding:2px 8px;border-radius:999px;background:${col}22;color:${col};font-weight:700;font-variant-numeric:tabular-nums">${s}%</span>`;
}

async function renderPhonetik() {
  const root = document.getElementById("panelPhonetik");
  if (!root) return;
  if (!isMain()) { root.innerHTML = `<div class="card">Kein Zugriff</div>`; return; }
  root.innerHTML = `<div class="card"><strong>Auto-Phonetik</strong><p class="help">Lade…</p></div>`;
  const ph = await loadPhonetic(true);
  const voices = VOICES().filter(v => v.audio);
  const withScore = voices.map(v => {
    const r = ph.map[v.id];
    return { v, r, score: r ? r.score : -1 };
  }).sort((a, b) => (a.score < 0 ? 999 : a.score) - (b.score < 0 ? 999 : b.score));

  const avg = withScore.filter(x => x.score >= 0);
  const avgScore = avg.length ? Math.round(avg.reduce((s, x) => s + x.score, 0) / avg.length) : null;

  root.innerHTML = `
  <div class="card">
    <strong>Auto-Phonetik · TTS-Text → STT → Diff</strong>
    <p class="help" style="margin-top:6px">
      Worker holt das Sample-Audio, transkribiert es via Fish ASR und vergleicht mit dem erwarteten Skript
      (Fish-[Tags] werden entfernt). Score = 55% Wort-F1 + 45% Zeichen-Ähnlichkeit.
    </p>
    <div class="meta" style="margin-top:8px">
      Fish-Key im Worker: <strong>${ph.fishKey ? "gesetzt ✓" : "fehlt ✗ (Secret FISH_API_KEY)"}</strong>
      · Ergebnisse: <strong>${ph.list.length}</strong>
      ${avgScore!=null?` · Ø Score: <strong>${avgScore}%</strong>`:""}
    </div>
    <div class="actions" style="margin-top:12px;flex-wrap:wrap;gap:8px">
      <button type="button" class="btn btn-p" id="btnPhRefresh">Aktualisieren</button>
      <button type="button" class="btn btn-ok" id="btnPhRunClones" ${ph.fishKey?"":"disabled title=\\\"FISH_API_KEY fehlt\\\""}>Clones analysieren (max 5)</button>
      <button type="button" class="btn btn-g" id="btnPhRunMissing" ${ph.fishKey?"":"disabled"}>Fehlende (max 3)</button>
    </div>
    ${!ph.fishKey?`<p class="help" style="margin-top:10px;color:#e6b84d">
      Worker-Secret <code>FISH_API_KEY</code> setzen, dann hier live laufen lassen — oder Ergebnisse via
      <code>POST /api/phonetic/ingest</code> (Admin-Key / Main) vorab einspielen.
    </p>`:""}
  </div>
  <div class="card">
    <strong>Stimmen mit Audio (${voices.length})</strong>
    <div style="margin-top:10px;display:flex;flex-direction:column;gap:10px">
      ${withScore.map(({v,r,score}) => `
        <div class="va-card" style="padding:12px;border:1px solid var(--border);border-radius:12px">
          <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap">
            <div>
              <strong>${esc(v.title)}</strong>
              <div class="meta">${esc(v.group||"")} · ${esc(v.id)}</div>
            </div>
            <div>${r ? scoreBadge(r.score) : `<span class="meta">— noch nicht</span>`}</div>
          </div>
          ${r?`
            <div class="meta" style="margin-top:8px">
              recall ${(r.word_recall*100).toFixed(0)}% · prec ${(r.word_precision*100).toFixed(0)}% · char ${(r.char_ratio*100).toFixed(0)}%
              · ${esc(r.model||"")} · ${r.updated_at?new Date(r.updated_at).toLocaleString():""}
            </div>
            ${r.error?`<div style="color:#e35d6a;font-size:.85rem;margin-top:6px">${esc(r.error)}</div>`:""}
            <details style="margin-top:8px">
              <summary class="meta" style="cursor:pointer">STT / Diff anzeigen</summary>
              <div style="margin-top:8px;font-size:.85rem;line-height:1.45">
                <div><strong>Erwartet</strong><pre style="white-space:pre-wrap;margin:4px 0;padding:8px;background:var(--s2,#1b2330);border-radius:8px">${esc((r.expected_text||"").slice(0,500))}</pre></div>
                <div><strong>STT</strong><pre style="white-space:pre-wrap;margin:4px 0;padding:8px;background:var(--s2,#1b2330);border-radius:8px">${esc((r.transcript||"").slice(0,500) || "—")}</pre></div>
              </div>
            </details>
          `:""}
          <div class="actions" style="margin-top:10px">
            <button type="button" class="btn btn-g" data-ph-run="${esc(v.id)}" ${ph.fishKey?"":"disabled"}>Analysieren</button>
            ${v.audio?`<a class="btn btn-d" href="${esc(v.audio)}" target="_blank" rel="noopener">Audio</a>`:""}
          </div>
        </div>
      `).join("")}
    </div>
  </div>`;

  document.getElementById("btnPhRefresh").onclick = () => renderPhonetik();

  const runOne = async (voiceId) => {
    const v = VOICES().find(x => x.id === voiceId);
    if (!v) return toast("Stimme nicht gefunden");
    if (!v.audio) return toast("Kein Audio");
    const expected = expectedScriptForVoice(v);
    if (!expected) return toast("Kein Expected-Skript");
    toast("STT läuft… " + (v.title||"").slice(0,40));
    try {
      const res = await api("/api/phonetic/run", {
        method: "POST",
        body: JSON.stringify({
          voice_id: v.id,
          audio_url: v.audio,
          expected_text: expected,
          language: v.lang || "bs",
        }),
      });
      if (res.ok) toast(`Score ${res.result?.score ?? "?"} · ${v.title}`);
      else toast(res.error || "Fehler");
    } catch (e) {
      toast(e.message || "Phonetik-Fehler");
    }
    phoneticCache.loaded = false;
    renderPhonetik();
  };

  root.querySelectorAll("[data-ph-run]").forEach(btn => {
    btn.onclick = () => runOne(btn.getAttribute("data-ph-run"));
  });

  const runBatch = async (list, maxN) => {
    const slice = list.slice(0, maxN);
    for (const v of slice) {
      await runOne(v.id);
    }
  };

  document.getElementById("btnPhRunClones").onclick = async () => {
    const clones = VOICES().filter(v => v.group === "bs-clone" && v.audio);
    await runBatch(clones, 5);
  };
  document.getElementById("btnPhRunMissing").onclick = async () => {
    const missing = VOICES().filter(v => v.audio && !ph.map[v.id]);
    await runBatch(missing, 3);
  };
}

function renderAdmin() {
  const root = document.getElementById("panelAdmin");
  if (!isMain()) { root.innerHTML = `<div class="card">Kein Zugriff</div>`; return; }
  const editing = editId ? VOICES().find(v => v.id === editId) : null;
  const form = editing || emptyVoice();
  root.innerHTML = `<div class="card">
    <strong>Stimmen-Katalog (Main)</strong>
    <p class="help">Änderungen hier = Browser-Entwurf. Fürs Team: Config exportieren → Repo committen → Worker-Pin.</p>
    <div class="actions">
      <button type="button" class="btn btn-ok" id="btnExportCfg">Config exportieren</button>
      <button type="button" class="btn btn-g" id="btnImportCfg">Config importieren</button>
      ${hasOverride()?`<button type="button" class="btn btn-d" id="btnResetCfg">Entwurf verwerfen</button>`:""}
    </div>
  </div>
  <div class="card">
    <strong>${editing?"Bearbeiten":"Neue Stimme"}</strong>
    <div class="form-grid">
      <label class="field">Titel<input id="fTitle" value="${esc(form.title)}"/></label>
      <label class="field">ID<input id="fId" value="${esc(form.id)}" ${editing?"readonly":""}/></label>
      <label class="field">Sex
        <select id="fSex"><option value="m" ${form.sex==="m"?"selected":""}>m</option>
        <option value="f" ${form.sex==="f"?"selected":""}>f</option>
        <option value="x" ${form.sex==="x"?"selected":""}>x</option></select>
      </label>
      <label class="field full">Audio URL<input id="fAudio" value="${esc(form.audio)}"/></label>
      <label class="field full">Notiz<input id="fNote" value="${esc(form.note||"")}"/></label>
    </div>
    <div class="actions">
      <button type="button" class="btn btn-p" id="btnSaveVoice">Speichern</button>
      ${editing?`<button type="button" class="btn btn-g" id="btnCancelEdit">Abbrechen</button>`:""}
    </div>
  </div>
  <div class="card"><strong>Stimmen (${VOICES().length})</strong>
    ${VOICES().map((v,i)=>`<div class="va-card" style="padding:10px;border:1px solid var(--border);border-radius:10px;margin:8px 0">
      <strong>${i+1}. ${esc(v.title)}</strong> ${archivedIds.has(v.id)?'<span class="archived-tag">ARCHIV</span>':''}
      <div class="meta">${esc(v.id)}</div>
      <div class="actions"><button type="button" class="btn btn-g" data-edit="${esc(v.id)}">Edit</button>
      <button type="button" class="btn btn-d" data-rm="${esc(v.id)}">Entfernen</button></div>
    </div>`).join("")}
  </div>`;

  document.getElementById("btnSaveVoice").onclick = () => {
    const v = {
      id: document.getElementById("fId").value.trim(),
      title: document.getElementById("fTitle").value.trim(),
      sex: document.getElementById("fSex").value,
      audio: document.getElementById("fAudio").value.trim(),
      note: document.getElementById("fNote").value.trim(),
      tags: [],
    };
    if (!v.id || !v.title || !v.audio) return toast("id, title, audio Pflicht");
    const cfg = clone(CONFIG);
    const idx = cfg.voices.findIndex(x => x.id === v.id);
    if (idx >= 0) cfg.voices[idx] = { ...cfg.voices[idx], ...v };
    else cfg.voices.push(v);
    editId = null;
    persistDraft(cfg);
  };
  const cancel = document.getElementById("btnCancelEdit");
  if (cancel) cancel.onclick = () => { editId = null; renderAdmin(); };
  root.querySelectorAll("[data-edit]").forEach(b => { b.onclick = () => { editId = b.dataset.edit; renderAdmin(); }; });
  root.querySelectorAll("[data-rm]").forEach(b => {
    b.onclick = () => {
      if (!confirm("Aus Katalog entfernen?")) return;
      const cfg = clone(CONFIG);
      cfg.voices = cfg.voices.filter(v => v.id !== b.dataset.rm);
      persistDraft(cfg);
    };
  });
  document.getElementById("btnExportCfg").onclick = async () => {
    const text = JSON.stringify(CONFIG, null, 2);
    try { await navigator.clipboard.writeText(text); toast("Config kopiert"); }
    catch { prompt("Config:", text); }
  };
  document.getElementById("btnImportCfg").onclick = () => {
    const raw = prompt("config.json:");
    if (!raw) return;
    try {
      const cfg = JSON.parse(raw);
      persistDraft(cfg);
      currentTab = "admin";
      setTab("admin");
    } catch (e) { toast(e.message); }
  };
  const reset = document.getElementById("btnResetCfg");
  if (reset) reset.onclick = () => {
    clearOverride();
    applyConfig(clone(FILE_CONFIG), "file");
    toast("Zurück zu config.json");
  };
}

function startCloudPoll() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    if (document.hidden) return;
    const cloud = await fetchCloudRatings();
    if (!cloud) return;
    let changed = false;
    for (const [k,v] of Object.entries(cloud)) {
      const cur = state[k];
      if (!cur || cur.pron!==v.pron || cur.prof!==v.prof || cur.warm!==v.warm || cur.clar!==v.clar || cur.emo!==v.emo || (cur.comment||"")!==(v.comment||"")) {
        state[k] = v; changed = true;
      }
    }
    if (changed) {
      saveRatingsLocal(state);
      cloudCount = Object.keys(cloud).length;
      if (currentTab === "rate") renderRate(true);
      else if (currentTab === "rank") renderRank();
    }
  }, 10000);
}

async function boot() {
  document.getElementById("boot").textContent = "Lade v" + APP_VERSION + "…";
  let fileCfg = null;
  try {
    const r = await fetch("config.json?_=" + Date.now(), { cache: "no-store" });
    if (r.ok) fileCfg = await r.json();
  } catch {}
  if (!fileCfg && EMBEDDED_CONFIG) fileCfg = EMBEDDED_CONFIG;
  if (!fileCfg) {
    document.getElementById("boot").textContent = "config.json fehlt.";
    return;
  }
  FILE_CONFIG = fileCfg;

  await loadMe();
  const local = loadRatings();
  const cloud = await fetchCloudRatings();
  if (cloud) {
    state = { ...local, ...cloud };
    // merge by ts
    for (const [k,v] of Object.entries(cloud)) {
      const loc = local[k];
      if (!loc || (v.ts||0) >= (loc.ts||0)) state[k] = v;
    }
    saveRatingsLocal(state);
    cloudCount = Object.keys(state).length;
  } else state = local;

  await loadUsers();
  if (isMain()) await loadArchive();

  // if tester locked, ensure name
  if (currentUser?.name) lockedReviewer = currentUser.name;

  const override = loadOverride();
  try {
    applyConfig(override || fileCfg, override ? "browser-override" : "file");
  } catch (e) {
    if (override) { clearOverride(); applyConfig(fileCfg, "file"); }
    else document.getElementById("boot").textContent = "Config ungültig: " + e.message;
  }
  startCloudPoll();
  document.getElementById("boot").style.display = "none";
  if (cloudOnline) toast("Cloud · v" + APP_VERSION + " · " + (currentUser?.name || "Gast"));
  else toast("⚠ Cloud offline");
}

boot();
